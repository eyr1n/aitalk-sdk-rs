[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aitalk-sdk = { path = "../../aitalk-sdk" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
hound = "3.5.1"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
